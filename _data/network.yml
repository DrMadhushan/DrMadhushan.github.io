#   id                 Unique slug (used internally)
#   name               Display name
#   category           academic | professional
#   relationship_type  mentor | mentee | peer
#   strength           1–5 (controls node size; 5 = strongest tie)
#   avatar             Path to avatar image (place in /assets/img/network/avatars/)
#   collaborations     List of project / paper names
#   summary            ~30-word collaboration summary
#   description        Longer free-text description (shown in tooltip)
#   url                Optional link to profile / homepage
# ──────────────────────────────────────────────────────────────

